{% extends 'base.html' %}
{% load static %}

{% block title %}Peer Lounge - SmartBot AI Companion - SmartShare{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 py-6 h-[calc(100vh-8.5rem)] min-h-[560px] flex flex-col">

  <!-- Organic Pebble Chatbot Container -->
  <div class="flex flex-col bg-[#FFFDF9] border border-cream-300 rounded-[2.5rem] shadow-pebble overflow-hidden h-full">

    <!-- Top Chat Header -->
    <div class="p-4 px-6 border-b border-cream-200 flex items-center justify-between bg-cream-100/70">
      <div class="flex items-center gap-3.5">
        <div class="h-11 w-11 rounded-full bg-gradient-to-tr from-botanical-600 to-sage-500 text-white flex items-center justify-center font-black text-base shadow-md shadow-botanical-600/20">
          <i class="fas fa-robot"></i>
        </div>
        <div class="text-left">
          <div class="flex items-center gap-2">
            <h2 class="text-base font-serif font-black text-charcoal-900 leading-tight">SmartBot</h2>
            <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-sage-100 text-sage-800 border border-sage-200">
              <span class="h-1.5 w-1.5 rounded-full bg-botanical-500 animate-pulse"></span>
              Online
            </span>
          </div>
          <p class="text-[11px] text-charcoal-500 font-medium">Organic Academic AI Companion & Vault Navigator</p>
        </div>
      </div>

      <!-- Header Actions -->
      <div class="flex items-center gap-2">
        <button 
          onclick="clearChatHistory()" 
          title="Clear conversation"
          class="px-4 py-1.5 bg-cream-200 hover:bg-cream-300 text-charcoal-700 rounded-full text-[11px] font-bold transition-all flex items-center gap-1.5 shadow-sm"
        >
          <i class="fas fa-trash-alt text-[10px]"></i>
          <span>Clear Chat</span>
        </button>
      </div>
    </div>

    <!-- Messages Container -->
    <div id="chat-messages" class="flex-grow p-6 overflow-y-auto space-y-4 bg-gradient-to-b from-[#FFFDF9] to-cream-100/40">
      <!-- Loading placeholder -->
      <div class="text-center py-12 text-xs text-charcoal-400 flex items-center justify-center gap-2">
        <i class="fas fa-circle-notch fa-spin text-botanical-500"></i>
        <span>Connecting to SmartBot...</span>
      </div>
    </div>

    <!-- Typing Indicator -->
    <div id="typing-indicator" class="hidden px-6 py-2.5 bg-cream-100/60 border-t border-cream-200 flex items-center gap-2.5 text-xs text-charcoal-600">
      <div class="h-6 w-6 rounded-full bg-botanical-100 text-botanical-700 flex items-center justify-center text-[10px]">
        <i class="fas fa-robot"></i>
      </div>
      <span class="font-bold text-[11px]">SmartBot is preparing response</span>
      <span class="flex gap-1 ml-1">
        <span class="h-1.5 w-1.5 rounded-full bg-botanical-400 animate-bounce"></span>
        <span class="h-1.5 w-1.5 rounded-full bg-botanical-400 animate-bounce [animation-delay:0.2s]"></span>
        <span class="h-1.5 w-1.5 rounded-full bg-botanical-400 animate-bounce [animation-delay:0.4s]"></span>
      </span>
    </div>

    <!-- Message Input Bar -->
    <div class="p-4 border-t border-cream-200 bg-[#FFFDF9]">
      <form id="chat-form" onsubmit="handleSendMessage(event)" class="flex items-center gap-3">
        <input 
          type="text" 
          id="chat-input"
          required
          autocomplete="off"
          placeholder="Ask SmartBot any academic question (e.g., Explain Dijkstra, Ohm's law, Photosynthesis, SQL joins)..."
          class="pebble-input flex-grow px-5 py-3 text-xs focus:bg-white rounded-full shadow-pebble-inner"
        >
        <button 
          type="submit" 
          id="send-btn"
          class="btn-botanical h-11 px-6 rounded-full flex items-center justify-center gap-2 text-xs font-bold shadow-md cursor-pointer flex-shrink-0"
        >
          <span>Send</span>
          <i class="fas fa-paper-plane text-[10px]"></i>
        </button>
      </form>
    </div>

  </div>

</div>

<script>
  const currentUserId = {{ request.user.id }};
  const currentUsername = "{{ request.user.username }}";
  const currentUserFirstName = "{{ request.user.first_name|default:request.user.username }}";

  function formatBotText(raw) {
    if (!raw) return '';

    // First extract code blocks: ```lang ... ```
    const codeBlocks = [];
    let text = raw.replace(/```([a-zA-Z0-9_#+-]*)\n([\s\S]*?)```/g, (match, lang, code) => {
      const id = `__CODE_BLOCK_${codeBlocks.length}__`;
      const escapedCode = code
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
      const langBadge = lang ? `<span class="text-[10px] font-bold text-cream-300 uppercase tracking-wider">${lang}</span>` : '';
      codeBlocks.push(`
        <div class="my-3 rounded-2xl bg-charcoal-900 text-cream-100 p-4 font-mono text-[11px] overflow-x-auto shadow-sm">
          ${langBadge ? `<div class="border-b border-white/15 pb-1.5 mb-2.5 flex justify-between items-center">${langBadge} <span class="text-[9px] text-white/30 font-sans uppercase">Code</span></div>` : ''}
          <pre class="leading-relaxed"><code>${escapedCode}</code></pre>
        </div>
      `);
      return id;
    });

    // Escape HTML in remaining text
    let escaped = text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");

    // Inline code: `code`
    escaped = escaped.replace(/`([^`]+)`/g, '<code class="px-1.5 py-0.5 rounded-md bg-cream-200 text-botanical-800 font-mono text-[11px]">$1</code>');

    // Headers: ###, ##, #
    escaped = escaped.replace(/^### (.*$)/gim, '<h4 class="font-serif font-black text-xs sm:text-sm text-charcoal-900 mt-3 mb-1">$1</h4>');
    escaped = escaped.replace(/^## (.*$)/gim, '<h3 class="font-serif font-black text-sm sm:text-base text-charcoal-900 mt-3.5 mb-1.5">$1</h3>');
    escaped = escaped.replace(/^# (.*$)/gim, '<h2 class="font-serif font-black text-base sm:text-lg text-charcoal-900 mt-4 mb-2">$1</h2>');

    // Replace Markdown links: [Title](url)
    escaped = escaped.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" class="text-botanical-700 font-bold hover:underline" target="_blank">$1</a>');

    // Replace bold text: **text**
    escaped = escaped.replace(/\*\*([^*]+)\*\*/g, '<strong class="font-bold text-charcoal-900">$1</strong>');

    // Replace italic text: *text*
    escaped = escaped.replace(/\*([^*]+)\*/g, '<em class="italic text-charcoal-700">$1</em>');

    // Process line by line for bullet points, numbered lists, and paragraphs
    const lines = escaped.split('\n');
    let html = '';
    let inList = false;
    let inNumList = false;

    lines.forEach(line => {
      const trimmed = line.trim();
      if (trimmed.startsWith('• ') || trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
        if (inNumList) { html += '</ol>'; inNumList = false; }
        if (!inList) {
          html += '<ul class="space-y-1.5 my-2 pl-1">';
          inList = true;
        }
        const content = trimmed.replace(/^([•\-\*]\s+)/, '');
        html += `<li class="flex items-start gap-2"><span class="text-botanical-600 font-bold">•</span><span>${content}</span></li>`;
      } else if (/^\d+\.\s+/.test(trimmed)) {
        if (inList) { html += '</ul>'; inList = false; }
        if (!inNumList) {
          html += '<ol class="space-y-1.5 my-2 pl-4 list-decimal marker:text-botanical-600 marker:font-bold">';
          inNumList = true;
        }
        const content = trimmed.replace(/^\d+\.\s+/, '');
        html += `<li><span>${content}</span></li>`;
      } else {
        if (inList) { html += '</ul>'; inList = false; }
        if (inNumList) { html += '</ol>'; inNumList = false; }
        if (trimmed === '') {
          html += '<div class="h-2"></div>';
        } else {
          html += `<p class="leading-relaxed mb-1.5">${trimmed}</p>`;
        }
      }
    });

    if (inList) html += '</ul>';
    if (inNumList) html += '</ol>';

    // Restore code blocks
    codeBlocks.forEach((block, idx) => {
      html = html.replace(`__CODE_BLOCK_${idx}__`, block);
    });

    return html;
  }

  function renderWelcomeScreen() {
    const container = document.getElementById('chat-messages');
    container.innerHTML = `
      <div class="py-8 px-4 text-center max-w-xl mx-auto space-y-6">
        <div class="h-16 w-16 mx-auto rounded-full bg-gradient-to-tr from-botanical-600 to-sage-500 text-white flex items-center justify-center text-2xl shadow-pebble">
          <i class="fas fa-robot"></i>
        </div>
        <div>
          <h3 class="text-xl font-serif font-black text-charcoal-900">Welcome to SmartBot, ${currentUserFirstName}!</h3>
          <p class="text-xs text-charcoal-600 mt-1 leading-relaxed font-medium">
            I am your dedicated academic guide. Inquire about course notes, exam strategies, or engineering concepts in the Vault.
          </p>
        </div>
        
        <!-- Interactive Prompt Chips (Organic Pill Buttons) -->
        <div class="space-y-2.5 text-left">
          <p class="text-[10px] font-bold text-charcoal-400 uppercase tracking-wider text-center">Suggested queries</p>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            <button onclick="askPrompt('Find notes for Computer Science')" class="p-3.5 text-left rounded-[1.25rem] border border-cream-300 bg-[#FFFDF9] hover:border-botanical-400 hover:bg-botanical-50/40 text-xs font-bold text-charcoal-800 transition-all flex items-center gap-2.5 group shadow-sm">
              <span class="h-7 w-7 rounded-full bg-botanical-100 text-botanical-700 flex items-center justify-center flex-shrink-0 text-xs group-hover:scale-110 transition-transform">📚</span>
              <span class="truncate">Computer Science notes</span>
            </button>
            <button onclick="askPrompt('Explain ACID properties in DBMS')" class="p-3.5 text-left rounded-[1.25rem] border border-cream-300 bg-[#FFFDF9] hover:border-sage-400 hover:bg-sage-50/40 text-xs font-bold text-charcoal-800 transition-all flex items-center gap-2.5 group shadow-sm">
              <span class="h-7 w-7 rounded-full bg-sage-100 text-sage-700 flex items-center justify-center flex-shrink-0 text-xs group-hover:scale-110 transition-transform">💡</span>
              <span class="truncate">Explain ACID properties</span>
            </button>
            <button onclick="askPrompt('How to prepare for semester exams?')" class="p-3.5 text-left rounded-[1.25rem] border border-cream-300 bg-[#FFFDF9] hover:border-ochre-400 hover:bg-ochre-50/40 text-xs font-bold text-charcoal-800 transition-all flex items-center gap-2.5 group shadow-sm">
              <span class="h-7 w-7 rounded-full bg-ochre-100 text-ochre-700 flex items-center justify-center flex-shrink-0 text-xs group-hover:scale-110 transition-transform">🎯</span>
              <span class="truncate">Exam preparation tactics</span>
            </button>
            <button onclick="askPrompt('How do contributor points work?')" class="p-3.5 text-left rounded-[1.25rem] border border-cream-300 bg-[#FFFDF9] hover:border-terracotta-400 hover:bg-terracotta-50/40 text-xs font-bold text-charcoal-800 transition-all flex items-center gap-2.5 group shadow-sm">
              <span class="h-7 w-7 rounded-full bg-terracotta-100 text-terracotta-700 flex items-center justify-center flex-shrink-0 text-xs group-hover:scale-110 transition-transform">🏆</span>
              <span class="truncate">How points work</span>
            </button>
          </div>
        </div>
      </div>
    `;
  }

  async function fetchMessages() {
    try {
      const token = localStorage.getItem('accessToken');
      const headers = { 'X-CSRFToken': window.getCsrfToken() };
      if (token) headers['Authorization'] = `Bearer ${token}`;

      const res = await fetch('/api/chat/', { headers });
      if (!res.ok) return;

      const data = await res.json();
      const messages = Array.isArray(data) ? data : (data.results || []);
      
      if (messages.length === 0) {
        renderWelcomeScreen();
      } else {
        renderMessages(messages);
      }
    } catch (err) {
      console.error('Chat fetch error:', err);
      renderWelcomeScreen();
    }
  }

  function renderMessages(messages) {
    const container = document.getElementById('chat-messages');
    if (!container) return;

    if (messages.length === 0) {
      renderWelcomeScreen();
      return;
    }

    container.innerHTML = messages.map(msg => {
      const isBot = msg.is_bot;
      const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      if (isBot) {
        return `
          <div class="flex items-start gap-3 text-left max-w-2xl">
            <div class="h-9 w-9 rounded-full bg-botanical-600 text-white flex items-center justify-center text-xs flex-shrink-0 shadow-sm mt-0.5">
              <i class="fas fa-robot"></i>
            </div>
            <div class="flex flex-col">
              <div class="flex items-center gap-2 mb-1 text-[10px] text-charcoal-400">
                <span class="font-bold text-botanical-700">SmartBot</span>
                <span>${time}</span>
              </div>
              <div class="bg-cream-100 text-charcoal-800 p-4 rounded-[1.5rem] rounded-tl-sm text-xs border border-cream-300 shadow-sm leading-relaxed">
                ${formatBotText(msg.message)}
              </div>
            </div>
          </div>
        `;
      } else {
        return `
          <div class="flex flex-col items-end text-right">
            <div class="flex items-center gap-2 mb-1 text-[10px] text-charcoal-400">
              <span class="font-bold text-charcoal-700">You</span>
              <span>${time}</span>
            </div>
            <div class="max-w-xl bg-botanical-600 text-white px-5 py-3 rounded-[1.5rem] rounded-tr-sm text-xs font-medium shadow-sm text-left leading-relaxed break-words">
              ${escapeHtml(msg.message)}
            </div>
          </div>
        `;
      }
    }).join('');

    container.scrollTop = container.scrollHeight;
  }

  function askPrompt(text) {
    const input = document.getElementById('chat-input');
    input.value = text;
    document.getElementById('chat-form').dispatchEvent(new Event('submit'));
  }

  async function handleSendMessage(e) {
    e.preventDefault();
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';

    const container = document.getElementById('chat-messages');
    const welcomeScreen = container.querySelector('.max-w-xl');
    if (welcomeScreen) {
      container.innerHTML = '';
    }

    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const userBubble = document.createElement('div');
    userBubble.className = 'flex flex-col items-end text-right';
    userBubble.innerHTML = `
      <div class="flex items-center gap-2 mb-1 text-[10px] text-charcoal-400">
        <span class="font-bold text-charcoal-700">You</span>
        <span>${time}</span>
      </div>
      <div class="max-w-xl bg-botanical-600 text-white px-5 py-3 rounded-[1.5rem] rounded-tr-sm text-xs font-medium shadow-sm text-left leading-relaxed break-words">
        ${escapeHtml(text)}
      </div>
    `;
    container.appendChild(userBubble);
    container.scrollTop = container.scrollHeight;

    // Show typing indicator
    const typing = document.getElementById('typing-indicator');
    typing.classList.remove('hidden');

    try {
      const token = localStorage.getItem('accessToken');
      const headers = {
        'Content-Type': 'application/json',
        'X-CSRFToken': window.getCsrfToken()
      };
      if (token) headers['Authorization'] = `Bearer ${token}`;

      const res = await fetch('/api/chat/ask-bot/', {
        method: 'POST',
        headers: headers,
        body: JSON.stringify({ message: text })
      });

      typing.classList.add('hidden');

      if (res.ok) {
        const data = await res.json();
        const botBubble = document.createElement('div');
        botBubble.className = 'flex items-start gap-3 text-left max-w-2xl';
        botBubble.innerHTML = `
          <div class="h-9 w-9 rounded-full bg-botanical-600 text-white flex items-center justify-center text-xs flex-shrink-0 shadow-sm mt-0.5">
            <i class="fas fa-robot"></i>
          </div>
          <div class="flex flex-col">
            <div class="flex items-center gap-2 mb-1 text-[10px] text-charcoal-400">
              <span class="font-bold text-botanical-700">SmartBot</span>
              <span>${time}</span>
            </div>
            <div class="bg-cream-100 text-charcoal-800 p-4 rounded-[1.5rem] rounded-tl-sm text-xs border border-cream-300 shadow-sm leading-relaxed">
              ${formatBotText(data.reply)}
            </div>
          </div>
        `;
        container.appendChild(botBubble);
        container.scrollTop = container.scrollHeight;
      } else {
        window.showToast('Could not reach SmartBot', 'error');
      }
    } catch (err) {
      typing.classList.add('hidden');
      console.error(err);
      window.showToast('Could not reach SmartBot', 'error');
    }
  }

  async function clearChatHistory() {
    if (!confirm('Clear your conversation with SmartBot?')) return;

    try {
      const token = localStorage.getItem('accessToken');
      const headers = { 'X-CSRFToken': window.getCsrfToken() };
      if (token) headers['Authorization'] = `Bearer ${token}`;

      const res = await fetch('/api/chat/clear/', {
        method: 'DELETE',
        headers: headers
      });

      if (res.ok) {
        renderWelcomeScreen();
        window.showToast('Conversation cleared', 'success');
      } else {
        window.showToast('Failed to clear chat', 'error');
      }
    } catch (err) {
      console.error(err);
      window.showToast('Failed to clear chat', 'error');
    }
  }

  function escapeHtml(text) {
    if (!text) return '';
    const map = {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#039;'
    };
    return text.replace(/[&<>"']/g, m => map[m]);
  }

  document.addEventListener('DOMContentLoaded', () => {
    fetchMessages();
  });
</script>
{% endblock %}
